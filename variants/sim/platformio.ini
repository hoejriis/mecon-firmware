; Simulated-board variant: the real upstream Companion and Repeater examples
; compiled into Linux executables. See docs/SIMULATION.md.
; ESP32 is defined for project sources only (build_src_flags), so the examples take their SPIFFS path and libraries do not.

[sim_base]
platform = native
build_flags =
  -std=gnu++17
  -w
  -include stdint.h
  -I variants/sim
  -I variants/sim/shims
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=5
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
build_src_flags = -D ESP32=1 -include variants/sim/sim_prelude.h
lib_deps =
  rweather/Crypto @ ^0.4.0
  electroniccats/CayenneLPP @ 1.6.1
  densaugeo/base64 @ ~1.4.0
lib_ldf_mode = chain+
lib_compat_mode = off
build_src_filter =
  -<*>
  +<*.cpp>
  -<armstubs.cpp>
  +<helpers/AdvertDataHelpers.cpp>
  +<helpers/BaseChatMesh.cpp>
  +<helpers/ClientACL.cpp>
  +<helpers/CommonCLI.cpp>
  +<helpers/CommonRadioPrefs.cpp>
  +<helpers/ConfigSerializer.cpp>
  +<helpers/DynamicConfigSerializer.cpp>
  +<helpers/IdentityStore.cpp>
  +<helpers/RegionMap.cpp>
  +<helpers/RegulatoryDutyCycle.cpp>
  +<helpers/StaticPoolPacketManager.cpp>
  +<helpers/TransportKeyStore.cpp>
  +<helpers/TxtDataHelpers.cpp>
  +<helpers/ArduinoSerialInterface.cpp>
  +<../variants/sim/*.cpp>

[env:sim_companion]
extends = sim_base
build_flags =
  ${sim_base.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
build_src_filter =
  ${sim_base.build_src_filter}
  +<../examples/companion_radio/*.cpp>

; Sanitizer builds: an out-of-bounds read or write, or undefined behaviour, aborts the node, so a test that
; only watches the node stay alive and answer fails on it. Used for the malformed-input tests.
; Shifts, signed overflow and alignment are left out: upstream's ed25519 code trips them on every start.
[sim_asan]
build_flags =
  -fsanitize=address,undefined
  -fno-sanitize=shift,signed-integer-overflow,alignment
  -fno-sanitize-recover=undefined
  -fno-omit-frame-pointer
  -g

[env:sim_repeater_asan]
extends = env:sim_repeater
build_flags =
  ${env:sim_repeater.build_flags}
  ${sim_asan.build_flags}

[env:sim_companion_asan]
extends = env:sim_companion
build_flags =
  ${env:sim_companion.build_flags}
  ${sim_asan.build_flags}

; The same Companion, but with the unauthenticated TCP transport class instead of USB serial.
[env:sim_companion_wifi]
extends = sim_base
build_flags =
  ${sim_base.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_WIFI_INTERFACE
  -D WIFI_SSID='"sim"'
build_src_filter =
  ${sim_base.build_src_filter}
  +<../examples/companion_radio/*.cpp>

; Both transports' CLI surface at once: a USB-class Companion built with the Wi-Fi settings commands.
; WIFI_SSID is left unset, so the Wi-Fi transport is not started and USB is the only transport.
[env:sim_companion_wifi_usb]
extends = sim_base
build_flags =
  ${sim_base.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_WIFI_INTERFACE
  -D ENABLE_USB_INTERFACE
build_src_filter =
  ${sim_base.build_src_filter}
  +<../examples/companion_radio/*.cpp>

[env:sim_repeater]
extends = sim_base
build_flags =
  ${sim_base.build_flags}
  -D ADVERT_NAME='"Sim Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter =
  ${sim_base.build_src_filter}
  +<../examples/simple_repeater/main.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>

[env:sim_room_server]
extends = sim_base
build_flags =
  ${sim_base.build_flags}
  -D ADVERT_NAME='"Sim Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter =
  ${sim_base.build_src_filter}
  +<../examples/simple_room_server/main.cpp>
  +<../examples/simple_room_server/MyMesh.cpp>
