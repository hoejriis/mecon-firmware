; Simulated-board variant: the real upstream Companion and Repeater examples
; compiled into Linux executables. See docs/SIMULATION.md.
; ESP32 is defined for project sources only (build_src_flags), so the examples take their SPIFFS path and libraries do not.

[sim_base]
platform = native
extra_scripts = pre:bin/mecon_version.py
build_flags =
  -std=gnu++17
  ; Every target toolchain (Xtensa ESP32, ARM nRF52/RP2040) treats plain char as unsigned; x86-64 Linux treats it as
  ; signed. Without this, UI key codes >= 0x80 (KEY_NEXT = 0xF1) arrive as negative chars on an x86 CI runner and
  ; never match, while an aarch64 host passes. Match the targets.
  -funsigned-char
  -w
  -include stdint.h
  -I variants/sim
  -I variants/sim/shims
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=5
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D SIM_FREE_HEAP
build_src_flags = -D ESP32=1 -include variants/sim/sim_prelude.h
lib_deps =
  rweather/Crypto @ ^0.4.0
  electroniccats/CayenneLPP @ 1.6.1
  densaugeo/base64 @ ~1.4.0
lib_ldf_mode = chain+
lib_compat_mode = off
build_src_filter =
  -<*>
  +<*.cpp>
  -<armstubs.cpp>
  +<helpers/AdvertDataHelpers.cpp>
  +<helpers/BaseChatMesh.cpp>
  +<helpers/ClientACL.cpp>
  +<helpers/ContactStore.cpp>
  +<helpers/CommonCLI.cpp>
  +<helpers/CommonRadioPrefs.cpp>
  +<helpers/ConfigSerializer.cpp>
  +<helpers/DynamicConfigSerializer.cpp>
  +<helpers/IdentityStore.cpp>
  +<helpers/RegionMap.cpp>
  +<helpers/RegulatoryDutyCycle.cpp>
  +<helpers/StaticPoolPacketManager.cpp>
  +<helpers/TransportKeyStore.cpp>
  +<helpers/TxtDataHelpers.cpp>
  +<helpers/ArduinoSerialInterface.cpp>
  +<../variants/sim/*.cpp>

[env:sim_companion]
extends = sim_base
build_flags =
  ${sim_base.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
build_src_filter =
  ${sim_base.build_src_filter}
  +<../examples/companion_radio/*.cpp>

; The Companion with the stock static contact array (-D CONTACTS_STOCK_ARRAY): the opt-out of the adaptive contact store
; (docs/CONTACTS.md). Same code path a board that opts out would compile.
[env:sim_companion_stockcontacts]
extends = env:sim_companion
build_flags =
  ${env:sim_companion.build_flags}
  -D CONTACTS_STOCK_ARRAY

; Sanitizer builds: an out-of-bounds read or write, or undefined behaviour, aborts the node, so a test that
; only watches the node stay alive and answer fails on it. Used for the malformed-input tests.
; Shifts, signed overflow and alignment are left out: upstream's ed25519 code trips them on every start.
[sim_asan]
build_flags =
  -fsanitize=address,undefined
  -fno-sanitize=shift,signed-integer-overflow,alignment
  -fno-sanitize-recover=undefined
  -fno-omit-frame-pointer
  -g

[env:sim_repeater_asan]
extends = env:sim_repeater
build_flags =
  ${env:sim_repeater.build_flags}
  ${sim_asan.build_flags}

[env:sim_companion_asan]
extends = env:sim_companion
build_flags =
  ${env:sim_companion.build_flags}
  ${sim_asan.build_flags}

; The same Companion, but with the unauthenticated TCP transport class instead of USB serial. It carries the MQTT
; controller too, so the Hardened rule "Wi-Fi only for MQTT, never the TCP port" runs on the TCP-class build.
[env:sim_companion_wifi]
extends = sim_base
build_flags =
  ${sim_base.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_WIFI_INTERFACE
  -D ENABLE_MQTT
  -D WIFI_SSID='"sim"'
  -lssl
  -pthread
  -lcrypto
build_src_filter =
  ${sim_base.build_src_filter}
  +<helpers/wifi/WifiCore.cpp>
  +<helpers/wifi/WifiProfiles.cpp>
  +<helpers/wifi/WifiController.cpp>
  +<helpers/mqtt/MqttCore.cpp>
  +<helpers/mqtt/MqttProfiles.cpp>
  +<helpers/mqtt/MqttController.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${sim_base.lib_deps}
  knolleary/PubSubClient @ 2.8.0

; Both transports' CLI surface at once: a USB-class Companion built with the Wi-Fi settings commands.
; WIFI_SSID is left unset, so the Wi-Fi transport is not started and USB is the only transport.
; This build also carries the MQTT controller (docs/MQTT.md): PubSubClient over a Linux socket with TLS from
; OpenSSL, against real brokers started by the tests.
[env:sim_companion_wifi_usb]
extends = sim_base
build_flags =
  ${sim_base.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_WIFI_INTERFACE
  -D ENABLE_USB_INTERFACE
  -D ENABLE_MQTT
  -lssl
  -pthread
  -lcrypto
build_src_filter =
  ${sim_base.build_src_filter}
  +<helpers/wifi/WifiCore.cpp>
  +<helpers/wifi/WifiProfiles.cpp>
  +<helpers/wifi/WifiController.cpp>
  +<helpers/mqtt/MqttCore.cpp>
  +<helpers/mqtt/MqttProfiles.cpp>
  +<helpers/mqtt/MqttController.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${sim_base.lib_deps}
  knolleary/PubSubClient @ 2.8.0

; The Wi-Fi/MQTT Companion under the sanitizers: the MQTT connect worker and its cancellation run under ASan and UBSan.
[env:sim_companion_wifi_usb_asan]
extends = env:sim_companion_wifi_usb
build_flags =
  ${env:sim_companion_wifi_usb.build_flags}
  ${sim_asan.build_flags}

; The standalone Companion (docs/CONNECTIVITY_MODE.md): connectivity-mode switching with the real ui-new screens.
; BLE is a simulated transport (variants/sim/sim_ble.h): a PIN pairing and the app's frames over a loopback socket, no radio.
; The mode logic, the screens and the BLE trust rules run, the BLE radio does not. The display records its frames and the button replays gestures from a file (variants/sim/sim_display.*).
; USB is the loopback port; the TCP side of the Wi-Fi mode is inert, as in sim_companion_wifi_usb.
[env:sim_companion_standalone]
extends = sim_base
build_flags =
  ${sim_base.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_CONNMODE
  -D ENABLE_MECON_IFACE
  -D ENABLE_USB_INTERFACE
  -D ENABLE_WIFI_INTERFACE
  -D ENABLE_MQTT
  -D BLE_PIN_CODE=123456
  -D SIM_BLE_STUB
  -D DISPLAY_CLASS=SimDisplay
  -D PIN_USER_BTN=0
  -D AUTO_OFF_MILLIS=0
  -lssl
  -pthread
  -lcrypto
build_src_filter =
  ${sim_base.build_src_filter}
  +<helpers/wifi/WifiCore.cpp>
  +<helpers/wifi/WifiProfiles.cpp>
  +<helpers/wifi/WifiController.cpp>
  +<helpers/mqtt/MqttCore.cpp>
  +<helpers/mqtt/MqttProfiles.cpp>
  +<helpers/mqtt/MqttController.cpp>
  +<helpers/iface/*.cpp>
  +<helpers/deployment/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${sim_base.lib_deps}
  knolleary/PubSubClient @ 2.8.0

[env:sim_repeater]
extends = sim_base
build_flags =
  ${sim_base.build_flags}
  -D ADVERT_NAME='"Sim Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D ENABLE_MECON_IFACE
build_src_filter =
  ${sim_base.build_src_filter}
  +<../examples/simple_repeater/main.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>
  +<helpers/iface/*.cpp>
  +<helpers/deployment/*.cpp>

; The repeater and room server with the Ethernet TCP console of the RAK4631 `_ethernet` builds (ETHERNET_ENABLED): the real
; mains and handlers, the console's TCP transport replaced by a loopback listener (variants/sim/SimEthernetCLI.h).
[env:sim_repeater_eth]
extends = env:sim_repeater
build_flags =
  ${env:sim_repeater.build_flags}
  -D ETHERNET_ENABLED=1
  -D SIM_ETHERNET_CONSOLE

[env:sim_room_server_eth]
extends = env:sim_room_server
build_flags =
  ${env:sim_room_server.build_flags}
  -D ETHERNET_ENABLED=1
  -D SIM_ETHERNET_CONSOLE

[env:sim_room_server]
extends = sim_base
build_flags =
  ${sim_base.build_flags}
  -D ADVERT_NAME='"Sim Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D ENABLE_MECON_IFACE
build_src_filter =
  ${sim_base.build_src_filter}
  +<../examples/simple_room_server/main.cpp>
  +<../examples/simple_room_server/MyMesh.cpp>
  +<helpers/iface/*.cpp>
  +<helpers/deployment/*.cpp>
