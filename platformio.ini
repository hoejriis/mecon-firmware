; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
  variants/*/platformio.ini
  platformio.local.ini

[arduino_base]
framework = arduino
monitor_speed = 115200
lib_deps =
  SPI
  Wire
  ;jgromes/RadioLib @ ^7.7.1
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1   ; NOTE: comment these out for more secure firmware
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
build_src_filter =
  +<*.cpp>
  +<helpers/*.cpp>
  +<helpers/radiolib/*.cpp>
  +<helpers/bridges/BridgeBase.cpp>
  +<helpers/ui/MomentaryButton.cpp>

; ----------------- ESP32 ---------------------

[esp32_base]
extends = arduino_base
platform = platformio/espressif32@6.11.0
monitor_filters = esp32_exception_decoder
extra_scripts =
  pre:bin/mecon_version.py
  merge-bin.py
build_flags = ${arduino_base.build_flags}
  -D ESP32_PLATFORM
;  -D ESP32_CPU_FREQ=80          ; change it to your need
build_src_filter = ${arduino_base.build_src_filter}

; NimBLE instead of Bluedroid for the ESP32 BLE Companion (-D USE_NIMBLE: src/helpers/esp32/SerialNimBLEInterface.cpp).
; The Heltec V3, Heltec V4 and LilyGo T-LoRa BLE Companions add these to their env: they keep the Bluedroid source and
; library out of the build and drop the NimBLE roles the Companion never uses (central, observer). See docs/PLATFORM.md.
[esp32_nimble]
build_flags =
  -D USE_NIMBLE
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -D CONFIG_BT_NIMBLE_MAX_BONDS=15   ; Bluedroid's CONFIG_BT_SMP_MAX_BONDS in arduino-esp32 2.0.17
lib_deps =
  h2zero/NimBLE-Arduino @ 2.3.9
build_src_filter =
  -<helpers/esp32/SerialBLEInterface.cpp>
lib_ignore =   ; the Bluedroid Arduino library, by its framework name in Arduino-ESP32 2.x and 3.x
  ESP32 BLE Arduino
  BLE

[esp32_ota]
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  file://arch/esp32/AsyncElegantOTA

; Arduino-ESP32 3.x on ESP-IDF 5 (pioarduino). The Heltec V3 and V4 build on it; every other ESP32 board, the LilyGo
; T-LoRa V2.1-1.6 included, stays on esp32_base. See docs/PLATFORM.md.
[esp32_idf5_base]
extends = esp32_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip

[esp32s3_idf5_base]
extends = esp32_idf5_base
; Hybrid compile (Issue #100, docs/PLATFORM.md "Heap: hybrid compile"): pioarduino rebuilds the Arduino IDF libraries with
; these options, once, into the shared framework-arduinoespressif32-libs package. Every ESP32-S3 env carries the same
; section, so they all share one rebuilt package; an env without it (or for another chip) reinstalls the stock libraries,
; so such envs need their own PLATFORMIO_CORE_DIR (the ESP32-C6 boards in all-boards.yml).
; Build the libraries first with bin/idf5_libs.sh (the real env's ../examples source entries escape the hybrid pass).
; CONFIG_MBEDTLS_DYNAMIC_BUFFER stays off: dynamic mbedTLS buffers break Wi-Fi once a TLS session starts (v3test, #100).
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp-sr
  espressif/esp-zboss-lib
  espressif/esp-zigbee-lib
  espressif/esp_modem
  espressif/esp-modbus
  espressif/esp_rcp_update
  chmorgan/esp-libhelix-mp3
custom_sdkconfig =
  CONFIG_ESP_WIFI_STATIC_TX_BUFFER=n
  CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER=y
  CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=16
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=n

; esp32c6 uses arduino framework 3.x
; WARNING: experimental. May not work as stable as other platforms.
[esp32c6_base]
extends = esp32_idf5_base

; ----------------- NRF52 ---------------------

[nrf52_base]
extends = arduino_base
platform = nordicnrf52
platform_packages =
  ; use internal fork that includes patch to ble stack to prevent firmware lockup during rapid connect/disconnect
  ; https://github.com/meshcore-dev/MeshCore/pull/1177
  ; https://github.com/meshcore-dev/MeshCore/pull/1295
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301665b40959682252911e57b11df3ee651a
  platformio/toolchain-gccarmnoneeabi@^1.140201.0
extra_scripts =
  pre:bin/mecon_version.py
  create-uf2.py
build_flags = ${arduino_base.build_flags}
  -D NRF52_PLATFORM
  -D LFS_NO_ASSERT=1
  -D EXTRAFS=1
  -D USE_CC310_HW_CRYPTO=1
lib_deps =
  ${arduino_base.lib_deps}
  https://github.com/oltaco/CustomLFS#0.2.3
; ----------------- RP2040 ---------------------

[rp2040_base]
extends = arduino_base
extra_scripts = pre:bin/mecon_version.py
upload_protocol = picotool
board_build.core = earlephilhower
platform = https://github.com/maxgerhardt/platform-raspberrypi.git   ; framework-arduinopico @ 1.50600.0+sha.6a1d13e9
build_flags = ${arduino_base.build_flags}
  -D RP2040_PLATFORM

; ----------------- STM32 ----------------------

[stm32_base]
extends = arduino_base
; Pinned pending upstream fix for upstream conversions.
; https://github.com/jgromes/RadioLib/issues/1873
platform = ststm32@19.7.1
extra_scripts =
  pre:bin/mecon_version.py
  post:arch/stm32/build_hex.py
build_flags = ${arduino_base.build_flags}
  -D STM32_PLATFORM
  -I src/helpers/stm32
  -I $PROJECT_PACKAGES_DIR/framework-arduinoststm32/libraries/SubGhz/src
build_src_filter = ${arduino_base.build_src_filter}
  +<helpers/stm32>
lib_deps = ${arduino_base.lib_deps}
  file://arch/stm32/Adafruit_LittleFS_stm32
  SubGhz

[sensor_base]
build_flags =
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
lib_deps =
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  robtillaart/INA226 @ ^0.6.4
  adafruit/Adafruit INA260 Library @ ^1.5.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  adafruit/Adafruit SHTC3 Library @ ^1.0.1
  sensirion/Sensirion I2C SHT4x @ ^1.1.2
  arduino-libraries/Arduino_LPS22HB @ ^1.0.2
  adafruit/Adafruit MLX90614 Library @ ^2.1.5
  adafruit/Adafruit_VL53L0X @ ^1.2.4
  stevemarple/MicroNMEA @ ^2.0.6
  adafruit/Adafruit BME680 Library @ ^2.0.4
  adafruit/Adafruit BMP085 Library @ ^1.2.4

; ----------------- TESTING ---------------------

[env:native]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I src
  -I test/mocks
  -D CONTACT_STORE_NATIVE_TEST
test_build_src = yes
test_ignore = test_kiss_modem
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/Packet.cpp>
  +<../src/helpers/ConfigSerializer.cpp>
  +<../src/helpers/ContactStore.cpp>
  +<../src/helpers/DynamicConfigSerializer.cpp>
  +<../src/helpers/RegulatoryDutyCycle.cpp>
  +<../src/helpers/wifi/WifiCore.cpp>
  +<../src/helpers/wifi/WifiProfiles.cpp>
  +<../src/helpers/mqtt/MqttCore.cpp>
  +<../src/helpers/mqtt/MqttProfiles.cpp>
  +<../src/helpers/iface/IfaceJson.cpp>
  +<../src/helpers/iface/IfaceEnvelope.cpp>
  +<../src/helpers/iface/IfaceFrames.cpp>
  +<../src/helpers/iface/IfaceDispatch.cpp>
  +<../src/helpers/iface/IfaceConfig.cpp>
  +<../src/helpers/deployment/DepAuthority.cpp>
  +<../src/helpers/deployment/DepRecord.cpp>
  +<../src/helpers/deployment/DepReplay.cpp>
  +<../src/helpers/deployment/DepProvision.cpp>
  +<../src/helpers/deployment/DepWrapper.cpp>
  +<../src/helpers/deployment/DepState.cpp>
  +<../src/helpers/deployment/DepHmac.cpp>
  +<../src/helpers/iface/Lpp.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_kiss_modem]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I test/mocks
  -I src
  -I examples/kiss_modem
test_build_src = yes
test_filter = test_kiss_modem
build_src_filter =
  -<*>
  +<../examples/kiss_modem/KissModem.cpp>
  +<../src/helpers/RegulatoryDutyCycle.cpp>
lib_deps =
  google/googletest @ 1.17.0
