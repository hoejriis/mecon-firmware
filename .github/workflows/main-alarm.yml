name: Main alarm

# A failed or cancelled run on main that nobody watches is silent: it shows in the Actions tab and in an e-mail. This
# reusable step puts it in the Issue list instead (#146). It opens one tracking Issue per title, labelled bug, P2 and
# Ready for Devel (so an idle coder picks it up), or comments on it while it is open. It never closes it: whoever fixes
# the cause closes it after a green run.
#
# Called as the last job of a workflow, with `if:` limited to runs on main that matter (the nightly, a merge) and to a
# failed or cancelled result, so a green run and a pull request write nothing. Its own failure (an API error) shows as
# this job failing; the caller's result is left as it was.

on:
  workflow_call:
    inputs:
      title:
        description: The tracking Issue's exact title
        required: true
        type: string
      message:
        description: What to say in place of the failed-run report, for an alarm about a run that never happened
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  alarm:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: ${{ inputs.title }}
      MESSAGE: ${{ inputs.message }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the tracking Issue
        run: |
          set -euo pipefail
          if [ -n "$MESSAGE" ]; then
            body=$(printf '%s\n\n- reported by: %s\n' "$MESSAGE" "$RUN_URL")
          else
            jobs=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
                    | "- \(.name): \(.conclusion)"')
            body=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n' \
              "${{ github.workflow }} on \`${{ github.ref_name }}\` did not pass: $RUN_URL" \
              "- event: ${{ github.event_name }}" \
              "- commit: ${{ github.sha }}" \
              "- attempt: ${{ github.run_attempt }}" \
              "${jobs:-(no job reported failed or cancelled; see the run)}")
          fi
          # An exact title match among the open bug Issues, listed rather than searched: the search index lags a new
          # Issue, so two alarms in quick succession would each open one.
          n=$(gh issue list --state open --label bug --json number,title --limit 200 \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
            echo "commented on #$n"
          else
            gh issue create --title "$TITLE" --label bug --label P2 --label "Ready for Devel" --body "$body"
          fi
