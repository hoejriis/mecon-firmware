name: Main alarm

# A failed or cancelled run on main that nobody watches is silent: it shows in the Actions tab and in an e-mail. This
# reusable step puts it in the Issue list instead (#146). It opens one tracking Issue per title, labelled bug and P2,
# or comments on it while it is open. It never closes it: whoever fixes the cause closes it after a green run.
#
# Called as the last job of a workflow, with `if:` limited to runs on main that matter (the nightly, a merge) and to a
# failed or cancelled result, so a green run and a pull request write nothing. Its own failure (an API error) shows as
# this job failing; the caller's result is left as it was.

on:
  workflow_call:
    inputs:
      title:
        description: The tracking Issue's exact title
        required: true
        type: string

permissions:
  contents: read

jobs:
  alarm:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: ${{ inputs.title }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the tracking Issue
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
                  | "- \(.name): \(.conclusion)"')
          body=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n' \
            "${{ github.workflow }} on \`${{ github.ref_name }}\` did not pass: $RUN_URL" \
            "- event: ${{ github.event_name }}" \
            "- commit: ${{ github.sha }}" \
            "- attempt: ${{ github.run_attempt }}" \
            "${jobs:-(no job reported failed or cancelled; see the run)}")
          # An exact title match among the open Issues: the search alone matches words, not the whole title.
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --limit 50 \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
            echo "commented on #$n"
          else
            gh issue create --title "$TITLE" --label bug --label P2 --body "$body"
          fi
