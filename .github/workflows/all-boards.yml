name: All boards

# Compiles every PlatformIO environment in the repository (the full upstream
# board set plus this project's additions), split into shards. Pull requests
# run the smaller upstream PR build check; this workflow is the full software
# verification, run nightly, on demand and before a release.
#
# Compiling is not a hardware-support claim.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: Fail shard 0 on purpose, to test the tracking-Issue alarm (#146)
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '.github/workflows/all-boards.yml'

# A newer push to the same branch makes this run obsolete: cancel it rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLATFORMIO_VERSION: '6.2.0'
  SHARDS: 24

jobs:
  plan:
    # Draft PRs skip this; it runs once the PR is marked ready, and on every later push to it.
    # Nightly and by hand; on a PR that edits this file only when it is ready and labelled full-ci, as the mutation matrix.
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install "platformio==${PLATFORMIO_VERSION}"
      - id: plan
        env:
          FORCE_FAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fail }}
        run: |
          if [ "$FORCE_FAIL" = "true" ]; then   # the alarm test needs a failure, not a full build: one empty shard
            echo 'shards=[{"id": 0, "envs": ""}]' >> "$GITHUB_OUTPUT"; exit 0
          fi
          pio project config --json-output > pio-config.json
          python3 - <<'PY'
          import json, os
          envs = sorted(s[0][4:] for s in json.load(open('pio-config.json'))
                        if s[0].startswith('env:') and not s[0].startswith('env:native'))
          n = int(os.environ['SHARDS'])
          shards = [{'id': i, 'envs': ' '.join(envs[i::n])} for i in range(n)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('shards=' + json.dumps(shards) + '\n')
          print(f'{len(envs)} environments in {n} shards')
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ env.PLATFORMIO_VERSION }}-shard-${{ matrix.shard.id }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini') }}
          restore-keys: pio-${{ env.PLATFORMIO_VERSION }}-shard-${{ matrix.shard.id }}-
      - run: pip install "platformio==${PLATFORMIO_VERSION}"
      - name: A forced failure, to test the alarm
        if: github.event_name == 'workflow_dispatch' && inputs.force_fail && matrix.shard.id == 0
        run: |
          echo "::error::force_fail: shard 0 fails on purpose"
          exit 1
      - name: Build shard ${{ matrix.shard.id }}
        run: |
          failed=()
          for env in ${{ matrix.shard.envs }}; do
            echo "::group::$env"
            if pio run -e "$env"; then echo "OK $env" >> results.txt; else echo "FAIL $env" >> results.txt; failed+=("$env"); fi
            echo "::endgroup::"
          done
          cat results.txt
          # The verdict job decides pass/fail against ci/known-upstream-failures.txt.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-shard-${{ matrix.shard.id }}
          path: results.txt

  verdict:
    needs: build
    # Only where the plan ran: a skipped plan skips the build, and the verdict would fail on it.
    if: always() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'full-ci')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Compare with the known upstream failures
        run: |
          cat results/*/results.txt > all.txt
          total=$(wc -l < all.txt)
          grep '^FAIL ' all.txt | awk '{print $2}' | sort > failed.txt
          grep -v '^#' ci/known-upstream-failures.txt | grep . | sort > known.txt
          echo "Compiled: $(grep -c '^OK ' all.txt) of $total environments"
          new=$(comm -23 failed.txt known.txt); fixed=$(comm -13 failed.txt known.txt)
          status=0
          if [ -n "$new" ]; then echo "::error::New compile failures (not in ci/known-upstream-failures.txt):"; echo "$new"; status=1; fi
          if [ -n "$fixed" ]; then echo "::error::Listed as failing but now compiles (remove from ci/known-upstream-failures.txt):"; echo "$fixed"; status=1; fi
          if [ "${{ needs.build.result }}" != "success" ]; then echo "::error::A shard did not complete (${{ needs.build.result }})"; status=1; fi
          exit $status

  alarm:
    # The nightly on main, or a forced failure by hand, that did not pass: one tracking Issue, opened or commented on.
    needs: [plan, build, verdict]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_fail)) &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/main-alarm.yml
    with:
      title: Nightly All boards failing on main
