name: Target boards

# Compiles the boards this project intends to verify on hardware, on every PR.
# The full upstream board set is compiled by the all-boards workflow.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# On a pull request a newer push makes this run obsolete: cancel it rather than queue behind it. On main every
# commit's run finishes, so each merge gets a verdict (#146): a newer one waits, and GitHub keeps only the newest
# pending run in the group, so a busy day does not queue a run per merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # The four largest builds (the Heltec V3 and V4 Wi-Fi and standalone Companions) run on the project's own x64 runners
    # when the change comes from this repository, which frees GitHub's hosted concurrency for the rest. A pull request
    # from a fork never runs on a self-hosted runner (its code is not ours to run there): it gets a hosted one. No
    # secret is passed to these jobs.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["Heltec_v3_companion_radio_wifi","Heltec_v3_companion_radio_standalone","heltec_v4_companion_radio_wifi","heltec_v4_companion_radio_standalone"]'), matrix.env) && fromJSON('["self-hosted","mecon-public","X64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        env:
          - Heltec_v3_companion_radio_usb
          - Heltec_v3_companion_radio_ble
          - Heltec_v3_companion_radio_wifi
          - Heltec_v3_companion_radio_standalone
          - Heltec_v3_repeater
          - Heltec_v3_room_server
          - heltec_v4_companion_radio_usb
          - heltec_v4_companion_radio_ble
          - heltec_v4_companion_radio_wifi
          - heltec_v4_companion_radio_standalone
          - heltec_v4_repeater
          - heltec_v4_room_server
          - t1000e_companion_radio_usb
          - t1000e_companion_radio_ble
          - t1000e_repeater
          - WioTrackerL1_companion_radio_usb
          - WioTrackerL1_companion_radio_ble
          - WioTrackerL1_repeater
          - LilyGo_TLora_V2_1_1_6_companion_radio_ble          # NimBLE, this board's default stack
          - wio-e5-mini_companion_radio_usb                    # STM32WLE5, 224 KB for the app: the tightest target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-6.2.0-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini') }}
          restore-keys: pio-6.2.0-${{ matrix.env }}-
      - run: pip install "platformio==6.2.0"
      - run: |
          set -o pipefail   # a failed build must fail the step, not be hidden by tee
          pio run -e ${{ matrix.env }} | tee build.log
      - name: Record RAM and flash
        run: |
          python3 - "${{ matrix.env }}" <<'PY'
          import json, re, sys
          env = sys.argv[1]; log = open('build.log').read()
          def used(kind):
              m = re.search(kind + r':\s*\[[^\]]*\]\s*[\d.]+% \(used (\d+) bytes from (\d+) bytes\)', log)
              return [int(m.group(1)), int(m.group(2))] if m else None
          json.dump({'env': env, 'ram': used('RAM'), 'flash': used('Flash')}, open('memory.json', 'w'))
          PY
          cat memory.json
      - uses: actions/upload-artifact@v4
        with:
          name: memory-${{ matrix.env }}
          path: memory.json

  memory:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: memory-*
          path: now
      - name: Fetch the latest main run's figures for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow target-boards.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          mkdir -p base
          if [ -n "$id" ]; then gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'memory-*' -D base || true; fi
      - name: Memory table
        run: |
          set -o pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          def load(root):
              out = {}
              for f in glob.glob(root + '/*/memory.json'):
                  d = json.load(open(f)); out[d['env']] = d
              return out
          now, base = load('now'), load('base')
          def cell(d, b, k):
              if not d.get(k): return 'n/a'
              u, t = d[k]; s = f'{u:,} B ({100*u/t:.1f}%)'
              if b and b.get(k): s += f' {u - b[k][0]:+,} B'
              return s
          print('| Environment | RAM (static) | Flash |')
          print('|---|---|---|')
          for env in sorted(now):
              print(f'| {env} | {cell(now[env], base.get(env), "ram")} | {cell(now[env], base.get(env), "flash")} |')
          print()
          print('Differences are against the latest successful run on main. Static RAM only; heap at run time needs hardware.')
          PY
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: ci
      - name: Size budget
        run: |
          set -o pipefail   # an over-budget exit must fail the step, not be hidden by tee
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, sys
          budget = {}
          for line in open('src/ci/size-budget.txt'):
              f = line.split('#', 1)[0].split()
              if f: budget[f[0]] = (int(f[1]), int(f[2]))
          now = {}
          for p in glob.glob('now/*/memory.json'):
              d = json.load(open(p)); now[d['env']] = d
          bad = []
          for env in sorted(now):
              d = now[env]
              if env not in budget:
                  bad.append(f'{env}: no budget in ci/size-budget.txt'); continue
              for i, k in enumerate(('flash', 'ram')):
                  if not d.get(k):
                      bad.append(f'{env}: {k} not reported by the build'); continue
                  if d[k][0] > budget[env][i]:
                      bad.append(f'{env}: {k} {d[k][0]:,} B is over its budget of {budget[env][i]:,} B '
                                 f'(+{d[k][0] - budget[env][i]:,} B)')
          for env in sorted(set(budget) - set(now)):
              bad.append(f'{env}: in ci/size-budget.txt but not built by this workflow')
          print()
          if bad:
              print('**Size budget: over** (raise the budget in this PR if the growth is intended)')
              for b in bad: print('- ' + b)
              for b in bad: print('::error::' + b, file=sys.stderr)
              sys.exit(1)
          print(f'Size budget: all {len(now)} targets within ci/size-budget.txt.')
          PY
