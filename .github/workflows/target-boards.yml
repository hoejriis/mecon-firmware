name: Target boards

# Compiles the boards this project intends to verify on hardware, on every PR.
# The full upstream board set is compiled by the all-boards workflow.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - Heltec_v3_companion_radio_usb
          - Heltec_v3_companion_radio_ble
          - Heltec_v3_companion_radio_wifi
          - Heltec_v3_repeater
          - Heltec_v3_room_server
          - heltec_v4_companion_radio_usb
          - heltec_v4_companion_radio_ble
          - heltec_v4_companion_radio_wifi
          - heltec_v4_repeater
          - heltec_v4_room_server
          - t1000e_companion_radio_usb
          - t1000e_companion_radio_ble
          - t1000e_repeater
          - WioTrackerL1_companion_radio_usb
          - WioTrackerL1_companion_radio_ble
          - WioTrackerL1_repeater
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-6.2.0-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini') }}
          restore-keys: pio-6.2.0-${{ matrix.env }}-
      - run: pip install "platformio==6.2.0"
      - run: pio run -e ${{ matrix.env }}
