name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'

# On a pull request a newer push makes this run obsolete: cancel it rather than queue behind it. On main every
# commit's run finishes, so each merge gets a verdict (#146): a newer one waits, and GitHub keeps only the newest
# pending run in the group, so a busy day does not queue a run per merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which environments: on a pull request not labelled full-ci, one per platform family (ESP32-S3, nRF52, RP2040, STM32),
  # enough to catch a change that breaks a platform; on full-ci, on main and dev, the whole list (#463). The label is read
  # from the event, so add full-ci before the push it is for: adding it fires no run of its own, which keeps the two
  # runs of one commit from cancelling each other (reference: the full-ci label race).
  plan:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.plan.outputs.envs }}
    steps:
      - id: plan
        env:
          FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo 'envs=["Heltec_v3_companion_radio_ble", "Heltec_v3_repeater", "Heltec_v3_room_server", "RAK_4631_companion_radio_ble", "RAK_4631_companion_radio_ethernet", "RAK_4631_repeater", "RAK_4631_repeater_ethernet", "RAK_4631_room_server", "RAK_4631_room_server_ethernet", "PicoW_repeater", "wio-e5-mini_repeater", "LilyGo_Tlora_C6_repeater_", "wio_wm1110_repeater", "Tbeam_SX1276_repeater"]' >> "$GITHUB_OUTPUT"
          else
            echo 'envs=["Heltec_v3_repeater", "RAK_4631_companion_radio_ble", "PicoW_repeater", "wio-e5-mini_repeater"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.plan.outputs.envs) }}

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Rebuild the Arduino IDF libraries (Heltec V3 and V4 envs only)
        run: |
          pip install PyYAML
          bin/idf5_libs.sh ${{ matrix.environment }}

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
