name: Stack gate

# The worst-case static stack depth of the nRF52 builds that run the device interface (#158). The Adafruit core runs
# loop() on a fixed 4 KB stack; a first deployment.provision overflowed it on hardware. Interface requests now run on an
# 8 KB worker (src/helpers/NrfWorker.h). This gate builds each env with GCC's call-graph files and fails when the loop
# task's worst path is over 4,096 B less a 256 B margin, or the worker's over 8,192 B less 256 B
# (tools/stack_callgraph.py). Indirect calls are followed only where --indirect names their targets; the tool lists the
# rest, so the number is a lower bound on what it cannot see.

on:
  pull_request:
    paths: ['src/**', 'examples/**', 'lib/**', 'variants/t1000-e/**', 'platformio.ini', 'tools/stack_callgraph.py',
            '.github/workflows/stack-gate.yml']
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [t1000e_repeater, t1000e_companion_radio_ble, t1000e_companion_radio_usb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-6.2.0-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini') }}
          restore-keys: pio-6.2.0-${{ matrix.env }}-
      - run: pip install "platformio==6.2.0"
      - name: Build with call-graph files
        env:
          PLATFORMIO_BUILD_FLAGS: -fstack-usage -fcallgraph-info=su
        run: |
          set -o pipefail
          pio run -e ${{ matrix.env }} | tail -5
      - name: Worst-case stack depth
        run: |
          set -o pipefail   # an over-limit exit must fail the step, not be hidden by tee
          python3 tools/stack_callgraph.py .pio/build/${{ matrix.env }} \
            --root 'loop_task\(void\*\)=3840' \
            --root 'NrfWorker::.*body=7936' \
            --indirect 'NrfWorker::.*body=answerJob|dispatchJob' \
            --indirect 'Dispatcher::handleWith=Iface::.*::op[A-Z][A-Za-z]*\(Iface::OpContext&\)|MeconIface::op[A-Z]|Iface::DeployAuth::op[A-Z]' \
            --indirect 'DeployAuth::dispatchSigned=ConsoleIface::runSigned|MeconIface::runSigned' \
            | tee -a "$GITHUB_STEP_SUMMARY"
