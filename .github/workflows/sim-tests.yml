name: Simulated boards

# Builds the host-native sim variant from the real Companion and Repeater
# sources and runs the simulated-board suite (docs/SIMULATION.md).
# A pass is software verification on simulated boards, not a hardware claim.

on:
  # Documentation-only pull requests skip this workflow (#245). The docs files the tests read stay in: the CLI
  # reference, the UI captures and everything under docs/contract (schemas, fixtures, release keys).
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/CLI_REFERENCE.md'
      - 'docs/UI.md'
      - 'docs/ui/**'
      - 'docs/contract/**'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pytest_args:
        description: 'Extra pytest arguments, e.g. a file or -k expression'
        required: false
        default: ''

# On a pull request a newer push makes this run obsolete: cancel it rather than queue behind it. On main every
# commit's run finishes, so each merge gets a verdict (#146): a newer one waits, and GitHub keeps only the newest
# pending run in the group, so a busy day does not queue a run per merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-latest
    # A full run takes 22-28 min on a hosted runner. Lock-step nodes wait on a broker barrier, so a deadlock would
    # otherwise hold the runner for GitHub's 6 h default before anyone saw a result.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-6.2.0-sim-${{ hashFiles('platformio.ini', 'variants/sim/**') }}
          restore-keys: pio-6.2.0-sim-
      - name: Broker and TLS tools for the MQTT tests
        # A hung Ubuntu mirror once held this step for the job's whole 30 min (#232): bound it, time apt out, retry once.
        timeout-minutes: 8
        run: |
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2; do
            timeout 180 $APT update && timeout 180 $APT install -y --no-install-recommends mosquitto mosquitto-clients openssl libssl-dev && break
            [ "$i" = 2 ] && exit 1
            echo "apt attempt $i failed or timed out; retrying"; sleep 10
          done
          sudo systemctl stop mosquitto || true   # the package starts a default broker; the tests start their own
      - run: pip install "platformio==6.2.0" pytest
      - name: Build every sim_* environment
        run: |
          envs=$(pio project config --json-output | python3 -c "import json,sys; print(' '.join('-e '+s[0][4:] for s in json.load(sys.stdin) if s[0].startswith('env:sim_')))")
          echo "$envs"
          pio run $envs
      - run: python3 -m pytest ${{ github.event.inputs.pytest_args || 'sim/tests' }} -v
