name: Mutation check

# Each job breaks one piece of code (sim/mutate.sh) and requires the tests that
# guard it to go red. A mutant that survives means a test that cannot fail.

on:
  pull_request:
    # Not `opened`: a PR created with full-ci fires `labeled` as well, and two runs for one commit cancelled each other.
    types: [synchronize, reopened, ready_for_review, labeled]
    paths: ['src/**', 'examples/**', 'variants/sim/**', 'sim/**', '.github/workflows/mutation.yml']
  push:
    branches: [main]
  workflow_dispatch:

# On a pull request a newer push makes this run obsolete: cancel it rather than queue behind it. On main every
# commit's run finishes, so each merge gets a verdict (#146): a newer one waits, and GitHub keeps only the newest
# pending run in the group, so a busy day does not queue a run per merge.
# The group says whether the run will do the work (the same test as the list job's `if`): a run that will only skip
# (a push without the label, another label added) must not cancel one that is an hour into the matrix, and a cancelled
# run stays on the PR as a failed check that blocks the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  list:
    # On main (after a merge) and by hand. A PR runs it only when it is ready and labelled full-ci (owner's
    # choice, 2026-10-29: the matrix is most of the repo's Actions minutes); adding the label starts it.
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-latest
    outputs:
      mutants: ${{ steps.list.outputs.mutants }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # Mutants run in batches: GitHub allows at most 256 jobs per matrix, and the suite has more mutants than that
        # (a matrix that is too large makes the whole run fail before any mutant job starts).
        run: |
          sh sim/mutate.sh --list > mutants.txt
          echo "$(wc -l < mutants.txt) mutants"
          batches=$(jq -R -s -c 'split("\n") | map(select(length > 0)) | [range(0; length; 4) as $i | .[$i:$i+4] | join(" ")]' mutants.txt)
          n=$(echo "$batches" | jq length)
          echo "$n batches"
          # fail loudly here (a visible check) rather than let an oversized matrix fail the run with no check at all
          if [ "$n" -gt 256 ]; then echo "::error::$n mutant batches exceed the 256-job matrix limit; raise the batch size"; exit 1; fi
          echo "mutants=$batches" >> "$GITHUB_OUTPUT"

  mutant:
    needs: list
    runs-on: ubuntu-latest
    # A batch takes 4.5 min typically and 9.7 min at the most (198 batches on main, 2026-10-30). A job that runs
    # three times that long is stuck or has lost its runner: it fails, and on main the alarm says so, rather than
    # sitting with no result.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mutant: ${{ fromJson(needs.list.outputs.mutants) }}
    env:
      SIM_NO_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-6.2.0-sim-${{ hashFiles('platformio.ini', 'variants/sim/**') }}
          restore-keys: pio-6.2.0-sim-
      - name: Broker and TLS tools for the MQTT tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mosquitto mosquitto-clients openssl libssl-dev
          sudo systemctl stop mosquitto || true   # the package starts a default broker; the tests start their own
      - run: pip install "platformio==6.2.0" pytest
      - name: Mutants ${{ matrix.mutant }} must all be killed
        run: |
          status=0
          for m in ${{ matrix.mutant }}; do
            sh sim/mutate.sh "$m" || status=1
          done
          exit $status
      - if: always()
        run: for m in ${{ matrix.mutant }}; do echo "== $m"; tail -15 ".sim-logs/mut_$m.log" 2>/dev/null; done

  alarm:
    # main is the only place the whole matrix runs (PRs only with full-ci): a failed or cancelled run there is as
    # silent as a red nightly, so it opens or comments on one tracking Issue.
    needs: [list, mutant]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/main-alarm.yml
    with:
      title: Mutation check failed or cancelled on main
