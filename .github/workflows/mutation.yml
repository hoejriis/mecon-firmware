name: Mutation check

# Each job breaks one piece of code (sim/mutate.sh) and requires the tests that
# guard it to go red. A mutant that survives means a test that cannot fail.
#
# Owner's rule, 2026-11-01: the full set runs once a day, as a nightly on main; every other run is a spot check.
# - full: the nightly, a run by hand, and a pull request that is ready and labelled full-ci (an opt-in for a risky change).
# - spot: every other pull request and every merge to main. Only the mutants that the change touches run
#   (sim/mutate_select.py: the file they mutate, their topic file or a test they name), plus a smoke set of one mutant
#   per topic when the mutation machinery itself changed. A change that touches no mutant runs none.

on:
  pull_request:
    # Not `opened`: a PR created with full-ci fires `labeled` as well, and two runs for one commit cancelled each other.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths: ['src/**', 'examples/**', 'variants/sim/**', 'sim/**', 'test/**', 'platformio.ini', '.github/workflows/mutation.yml']
  push:
    branches: [main]
    paths: ['src/**', 'examples/**', 'variants/sim/**', 'sim/**', 'test/**', 'platformio.ini', '.github/workflows/mutation.yml']
  schedule:
    - cron: '47 3 * * *'   # after the All boards nightly (02:17), so the two do not share the runners
  workflow_dispatch:

# On a pull request a newer push makes this run obsolete: cancel it rather than queue behind it. On main every run
# finishes, so each merge and each nightly gets a verdict (#146): a newer one waits, and GitHub keeps only the newest
# pending run in the group.
# The group is the run's mode, full or spot, so a spot run (a PR opened with full-ci fires `opened` and `labeled`) never
# cancels a full one, and a run that only skips (another label added) has a group of its own and cancels nothing: a
# cancelled run stays on the PR as a failed check that blocks the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))) && 'full' || ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'full-ci') && format('skip-{0}', github.run_id) || 'spot') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  list:
    # Every run but one that another label fired (adding a label other than full-ci changes no code).
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'full-ci') }}
    runs-on: ubuntu-latest
    outputs:
      mutants: ${{ steps.list.outputs.mutants }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the spot set diffs the change against its base
      - id: list
        # Mutants run in batches: GitHub allows at most 256 jobs per matrix, and the suite has more mutants than that
        # (a matrix that is too large makes the whole run fail before any mutant job starts).
        env:
          FULL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))) }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$FULL" = true ]; then
            echo "mode: full"; python3 sim/mutate_select.py full > mutants.txt
          else
            # a PR is checked out as its merge commit (parent 1 is the base); a push to main diffs from the previous head
            if [ "${{ github.event_name }}" = pull_request ]; then git diff --name-only HEAD^1 HEAD > changed.txt
            elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then git diff --name-only "$BEFORE" HEAD > changed.txt
            else echo sim/mutate.sh > changed.txt; fi   # no usable base: the smoke set
            echo "mode: spot, $(wc -l < changed.txt) changed paths"
            python3 sim/mutate_select.py spot changed.txt > mutants.txt
          fi
          sed -i '/^$/d' mutants.txt
          echo "$(wc -l < mutants.txt) mutants"
          batches=$(jq -R -s -c 'split("\n") | map(select(length > 0)) | [range(0; length; 4) as $i | .[$i:$i+4] | join(" ")]' mutants.txt)
          n=$(echo "$batches" | jq length)
          echo "$n batches"
          # fail loudly here (a visible check) rather than let an oversized matrix fail the run with no check at all
          if [ "$n" -gt 256 ]; then echo "::error::$n mutant batches exceed the 256-job matrix limit; raise the batch size"; exit 1; fi
          echo "mutants=$batches" >> "$GITHUB_OUTPUT"

  mutant:
    needs: list
    if: needs.list.outputs.mutants != '[]'   # a change that touches no mutant: nothing to run (the check shows skipped)
    runs-on: ubuntu-latest
    # A batch takes 4.5 min typically and 9.7 min at the most (198 batches on main, 2026-10-30). A job that runs
    # three times that long is stuck or has lost its runner: it fails, and on main the alarm says so, rather than
    # sitting with no result.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mutant: ${{ fromJson(needs.list.outputs.mutants) }}
    env:
      SIM_NO_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-6.2.0-sim-${{ hashFiles('platformio.ini', 'variants/sim/**') }}
          restore-keys: pio-6.2.0-sim-
      - name: Broker and TLS tools for the MQTT tests
        # A hung Ubuntu mirror once held this step for the job's whole 30 min (#232): bound it, time apt out, retry once.
        timeout-minutes: 8
        run: |
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2; do
            timeout 180 $APT update && timeout 180 $APT install -y --no-install-recommends mosquitto mosquitto-clients openssl libssl-dev && break
            [ "$i" = 2 ] && exit 1
            echo "apt attempt $i failed or timed out; retrying"; sleep 10
          done
          sudo systemctl stop mosquitto || true   # the package starts a default broker; the tests start their own
      - run: pip install "platformio==6.2.0" pytest
      - name: Mutants ${{ matrix.mutant }} must all be killed
        run: |
          status=0
          for m in ${{ matrix.mutant }}; do
            sh sim/mutate.sh "$m" || status=1
          done
          exit $status
      - if: always()
        run: for m in ${{ matrix.mutant }}; do echo "== $m"; tail -15 ".sim-logs/mut_$m.log" 2>/dev/null; done

  alarm:
    # The nightly is the only place the whole set runs, and a merge's spot run is main's verdict on that merge: a failed
    # or cancelled run of either is as silent as a red nightly, so it opens or comments on one tracking Issue.
    needs: [list, mutant]
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/main-alarm.yml
    with:
      title: Mutation check failed or cancelled on main
